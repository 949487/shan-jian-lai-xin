<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章 | 山间来信</title>
  <meta name="description" content="山间来信，一篇生活随笔。">
  <meta name="theme-color" content="#faf6ec">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css?v=4">
  <script>
    (function () {
      document.documentElement.classList.add("js");
      try {
        var t = localStorage.getItem("theme");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.content = t === "dark" ? "#0f120f" : "#faf6ec";
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">跳到正文</a>
  <div class="read-progress" id="read-progress" aria-hidden="true"></div>

  <header class="site-header" id="site-header">
    <div class="header-bar glass">
      <a class="brand" href="index.html" aria-label="山间来信 · 首页">
        <span class="brand-mark" aria-hidden="true">山</span>
        <span class="brand-text">山间<span>来信</span></span>
      </a>
      <nav class="nav" aria-label="主导航">
        <a href="index.html" class="is-active" aria-current="page">来信</a>
        <a href="about.html">关于</a>
      </nav>
      <div class="header-actions">
        <button class="icon-btn ripple" data-theme-toggle type="button" aria-label="切换深色模式">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2"/>
            <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a7 7 0 0 0 10.7 10.7Z"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main" class="post-page">
    <div class="wrap post-wrap">
      <a class="back-pill ripple" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M19 12H5M11 6l-6 6 6 6"/>
        </svg>
        全部来信
      </a>

      <header class="post-head">
        <div class="post-kicker" id="post-kicker">随笔</div>
        <h1 id="post-title">加载中…</h1>
        <div class="post-submeta">
          <span class="meta-pill">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <rect x="3.5" y="5" width="17" height="15.5" rx="3"/>
              <path d="M3.5 9.5h17M8 3v4M16 3v4"/>
            </svg>
            <span id="post-date"></span>
          </span>
          <span class="meta-pill">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <circle cx="12" cy="12" r="8.5"/>
              <path d="M12 7.5V12l3 1.8"/>
            </svg>
            <span id="post-read"></span>
          </span>
          <span class="meta-pill" id="post-tag"></span>
        </div>
      </header>

      <figure class="post-hero glass" id="post-hero"></figure>

      <nav class="toc-mobile" id="toc-mobile" aria-label="文章目录"></nav>

      <div class="post-layout">
        <article class="post-body" id="post-content"></article>
        <aside class="toc glass" id="toc" aria-label="文章目录">
          <div class="toc-title">本页目录</div>
          <div class="toc-list" id="toc-list"></div>
        </aside>
      </div>

      <footer class="post-end">
        <div class="author-card glass">
          <span class="avatar" aria-hidden="true">山</span>
          <div>
            <b>山间来信</b>
            <p>把普通日子写成信。不定期更新，通常在下雨的周末。</p>
          </div>
          <a class="btn btn--tonal ripple" href="about.html">关于这个博客</a>
        </div>

        <div class="post-actions">
          <div class="post-tags" id="post-tags"></div>
          <div class="action-row">
            <button class="btn btn--tonal ripple" id="copy-link" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M10 13a5 5 0 0 0 7.1 0l2-2a5 5 0 0 0-7.1-7.1L10.8 5"/>
                <path d="M14 11a5 5 0 0 0-7.1 0l-2 2a5 5 0 0 0 7.1 7.1l1.2-1.2"/>
              </svg>
              复制链接
            </button>
            <button class="btn btn--filled ripple" id="share-post" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="18" cy="5" r="2.6"/>
                <circle cx="6" cy="12" r="2.6"/>
                <circle cx="18" cy="19" r="2.6"/>
                <path d="m8.3 10.8 7.4-4.3M8.3 13.2l7.4 4.3"/>
              </svg>
              分享
            </button>
          </div>
        </div>

        <nav class="post-nav" id="post-nav" aria-label="文章导航"></nav>
      </footer>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-bar glass">
      <div class="footer-brand"><i aria-hidden="true">山</i>山间来信</div>
      <div class="footer-links">
        <span>© <span id="year">2026</span> · 用文字留住时间</span>
        <a href="index.html">全部来信</a>
        <a href="https://github.com/949487" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>
  </footer>

  <div class="fab-stack">
    <button class="fab ripple" id="copy-fab" type="button" data-tooltip="复制链接" aria-label="复制文章链接">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M10 13a5 5 0 0 0 7.1 0l2-2a5 5 0 0 0-7.1-7.1L10.8 5"/>
        <path d="M14 11a5 5 0 0 0-7.1 0l-2 2a5 5 0 0 0 7.1 7.1l1.2-1.2"/>
      </svg>
    </button>
    <button class="fab ripple" id="to-top" type="button" data-tooltip="回到顶部" aria-label="回到顶部">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 19V5M5 12l7-7 7 7"/>
      </svg>
    </button>
  </div>

  <script src="data/posts.js?v=4"></script>
  <script src="assets/js/main.js?v=4"></script>
</body>
</html>
